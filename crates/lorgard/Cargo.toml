[package]
name = "lorgard"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "User daemon for the LORGAR MSA10W"

[dependencies]
lorgar-core = { path = "../lorgar-core" }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"
ctrlc = { version = "3", features = ["termination"] }

[dev-dependencies]
tempfile = "3"
