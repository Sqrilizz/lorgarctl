[package]
name = "lorgar-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Core library and protocol implementation for LORGAR MSA10W mouse on Linux"

[dependencies]
hidapi = "2.6"
thiserror = "2.0"
log = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
fs2 = "0.4"
ctrlc = { version = "3", features = ["termination"] }
