[package]
name = "lorgarctl"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "CLI tool for configuring LORGAR MSA10W mouse on Linux"

[features]
default = ["tray"]
tray = ["dep:ksni"]

[dependencies]
lorgar-core = { path = "../lorgar-core" }
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
colored = "3.0"
ksni = { version = "0.3", features = ["blocking"], optional = true }
serde_json = "1"
serde = "1"
clap_complete = "4"
ctrlc = { version = "3", features = ["termination"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
cc = "1.0"
