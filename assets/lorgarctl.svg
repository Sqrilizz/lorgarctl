<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0a0b0d; }
      .stroke-main { stroke: #f0f3f6; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .stroke-thin { stroke: #5c6370; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .stroke-cyan { stroke: #00f0ff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .fill-white { fill: #f0f3f6; }
      .fill-cyan { fill: #00f0ff; }
      .telemetry { font-family: 'JetBrains Mono', 'Fira Code', monospace, sans-serif; font-size: 13px; font-weight: 700; fill: #00f0ff; letter-spacing: 1px; }
      .telemetry-dim { font-family: 'JetBrains Mono', monospace, sans-serif; font-size: 11px; fill: #5c6370; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="64" class="bg" />

  <!-- Outer HUD Corner Brackets -->
  <path d="M 48 96 L 48 48 L 96 48" class="stroke-main" stroke-width="8" />
  <path d="M 416 48 L 464 48 L 464 96" class="stroke-main" stroke-width="8" />
  <path d="M 48 416 L 48 464 L 96 464" class="stroke-main" stroke-width="8" />
  <path d="M 416 464 L 464 464 L 464 416" class="stroke-main" stroke-width="8" />

  <!-- Technical Telemetry & Calibration Grid -->
  <!-- Top Axis -->
  <text x="256" y="78" text-anchor="middle" class="telemetry">[0,0]</text>
  <text x="136" y="78" text-anchor="middle" class="telemetry-dim">-10mm</text>
  <text x="376" y="78" text-anchor="middle" class="telemetry-dim">+10mm</text>
  <line x1="100" y1="90" x2="412" y2="90" class="stroke-thin" stroke-dasharray="4,8" />
  <line x1="256" y1="84" x2="256" y2="96" class="stroke-cyan" />
  <line x1="136" y1="86" x2="136" y2="94" class="stroke-thin" />
  <line x1="376" y1="86" x2="376" y2="94" class="stroke-thin" />

  <!-- Bottom Axis -->
  <text x="256" y="444" text-anchor="middle" class="telemetry">LORGAR // PAW-3395</text>

  <!-- Reticle Circular Target Guide -->
  <circle cx="256" cy="260" r="148" class="stroke-thin" stroke-dasharray="6,12" opacity="0.6" />
  <circle cx="256" cy="260" r="192" class="stroke-thin" opacity="0.25" />

  <!-- Horizontal Axis Lines -->
  <line x1="72" y1="260" x2="116" y2="260" class="stroke-cyan" />
  <circle cx="116" cy="260" r="4" class="fill-cyan" />
  <line x1="396" y1="260" x2="440" y2="260" class="stroke-cyan" />
  <circle cx="396" cy="260" r="4" class="fill-cyan" />

  <!-- Inner Reticle Corner Marks -->
  <path d="M 104 140 L 104 116 L 128 116" class="stroke-thin" />
  <path d="M 384 116 L 408 116 L 408 140" class="stroke-thin" />
  <path d="M 104 380 L 104 404 L 128 404" class="stroke-thin" />
  <path d="M 384 404 L 408 404 L 408 380" class="stroke-thin" />

  <!-- Lateral Millimeter Ruler Ticks -->
  <path d="M 84 180 L 96 180 M 88 200 L 96 200 M 84 220 L 96 220 M 84 300 L 96 300 M 88 320 L 96 320 M 84 340 L 96 340" class="stroke-thin" />
  <path d="M 428 180 L 416 180 M 424 200 L 416 200 M 428 220 L 416 220 M 428 300 L 416 300 M 424 320 L 416 320 M 428 340 L 416 340" class="stroke-thin" />

  <!-- ============================================== -->
  <!-- CENTRAL GEOMETRIC ESPORTS GAMING MOUSE (MSA10W)-->
  <!-- ============================================== -->

  <!-- Top Cable Connector / Stiffener -->
  <rect x="250" y="106" width="12" height="18" rx="2" class="fill-white" />
  <line x1="256" y1="96" x2="256" y2="106" class="stroke-main" stroke-width="4" />

  <!-- Mouse Outer Shell Facets (Angular Ergonomic Geometry) -->
  <!-- Left Main Button (LMB) -->
  <path d="M 246 128 L 194 144 L 176 224 L 246 250 Z" class="stroke-main" stroke-width="5" />

  <!-- Right Main Button (RMB) -->
  <path d="M 266 128 L 318 144 L 336 224 L 266 250 Z" class="stroke-main" stroke-width="5" />

  <!-- Center Scroll Wheel & Housing -->
  <rect x="246" y="146" width="20" height="46" rx="6" class="stroke-main" stroke-width="4" />
  <!-- Wheel Ribs -->
  <line x1="248" y1="156" x2="264" y2="156" class="stroke-thin" stroke-width="2" />
  <line x1="248" y1="164" x2="264" y2="164" class="stroke-thin" stroke-width="2" />
  <line x1="248" y1="172" x2="264" y2="172" class="stroke-thin" stroke-width="2" />
  <line x1="248" y1="180" x2="264" y2="180" class="stroke-thin" stroke-width="2" />

  <!-- Center DPI Cycle Switch -->
  <polygon points="256,204 264,216 248,216" class="fill-white" />
  <rect x="251" y="222" width="10" height="16" rx="2" class="stroke-thin" />

  <!-- Left Ergonomic Thumb Wing & Side Grips -->
  <path d="M 176 224 L 160 252 L 164 316 L 190 358 L 202 342" class="stroke-main" stroke-width="5" />
  <!-- Side Buttons (Forward / Back) -->
  <path d="M 158 262 L 172 266 L 170 286 L 157 282 Z" class="fill-white" />
  <path d="M 159 290 L 171 293 L 168 312 L 159 308 Z" class="fill-white" />

  <!-- Right Lateral Stabilizer Wing -->
  <path d="M 336 224 L 348 260 L 344 322 L 322 358 L 310 342" class="stroke-main" stroke-width="5" />

  <!-- Palm Rest Lower Hull (Faceted Shell) -->
  <path d="M 190 358 L 222 404 L 256 414 L 290 404 L 322 358 L 296 264 L 216 264 Z" class="stroke-main" stroke-width="5.5" />

  <!-- Subtle Internal Facet Seams -->
  <line x1="256" y1="364" x2="256" y2="414" class="stroke-thin" />
  <line x1="222" y1="404" x2="256" y2="364" class="stroke-thin" />
  <line x1="290" y1="404" x2="256" y2="364" class="stroke-thin" />

  <!-- ============================================== -->
  <!-- COMMAND PROMPT EMBLEM ON PALM REST (`> _`)    -->
  <!-- ============================================== -->
  <!-- Terminal Chevron `>` -->
  <path d="M 232 296 L 254 316 L 232 336" class="stroke-main" stroke-width="9" stroke-linecap="square" />

  <!-- Terminal Block Cursor `_` -->
  <rect x="264" y="328" width="28" height="9" rx="1.5" class="fill-white" />
</svg>
