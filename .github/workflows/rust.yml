name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libdbus-1-dev \
            libglib2.0-dev \
            libudev-dev \
            libhidapi-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Unified local gate (fmt, clippy, tests, versions, kernel if headers present)
        run: bash tools/check.sh

      - name: Lean build without default tray (guards --no-default-features)
        run: cargo build -p lorgarctl --no-default-features --locked --verbose
