name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Package Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libdbus-1-dev \
            libglib2.0-dev \
            libudev-dev \
            libhidapi-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check version sync
        run: bash tools/check-versions.sh

      - name: Build release binaries
        run: cargo build --workspace --release --locked

      - name: Generate shell completions
        run: bash tools/generate-completions.sh target/completions

      - name: Prepare release archive
        run: |
          RELEASE_DIR="lorgar-${{ github.ref_name }}-linux-x86_64"
          mkdir -p "$RELEASE_DIR/bin" "$RELEASE_DIR/completions"
          cp target/release/lorgarctl "$RELEASE_DIR/bin/"
          cp target/release/lorgard "$RELEASE_DIR/bin/"
          cp target/completions/* "$RELEASE_DIR/completions/"
          cp -r udev systemd plasmoid assets "$RELEASE_DIR/"
          # Ship only kernel sources + packaging, never local build outputs.
          mkdir -p "$RELEASE_DIR/kernel"
          cp kernel/*.c kernel/*.h kernel/Makefile kernel/dkms.conf \
            kernel/*.conf kernel/*.sh kernel/README.md "$RELEASE_DIR/kernel/" 2>/dev/null || true
          cp README.md VERSIONS.md LICENSE-MIT LICENSE-APACHE "$RELEASE_DIR/"
          cp Cargo.lock "$RELEASE_DIR/"
          cargo tree --locked --prefix none > "$RELEASE_DIR/dependency-list.txt"

          tar -czf "$RELEASE_DIR.tar.gz" "$RELEASE_DIR"
          sha256sum "$RELEASE_DIR.tar.gz" > "$RELEASE_DIR.tar.gz.sha256"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            lorgar-*.tar.gz
            lorgar-*.tar.gz.sha256
          generate_release_notes: true
